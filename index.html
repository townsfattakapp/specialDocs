<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fattakse Modernization Platform Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Evolw Technologies - Fattakse 5-Month Greenfield Modernization Architecture and Execution Plans">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme: Modern Dark/Light via Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #f97316;
      --sidebar-width: 280px;
    }
    .markdown-section pre>code {
      font-size: 0.85rem;
    }
    /* Preserve wide legacy tables and diagrams on small screens instead of clipping them. */
    .markdown-section pre,
    .markdown-section table,
    .markdown-section .mermaid {
      max-width: 100%;
      overflow-x: auto;
    }
    .markdown-section pre {
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section .mermaid {
      padding-bottom: 0.5rem;
    }
    .markdown-section .mermaid svg {
      display: block;
      height: auto;
    }
    /* Mobile responsive enhancements */
    @media (max-width: 768px) {
      :root {
        --base-font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading Fattakse Modernization Docs...</div>
  <script>
    window.$docsify = {
      name: '⚡ Fattakse Modernization',
      repo: '',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      // Keep the full plans, rules, and skill/reference hierarchy visible.
      sidebarDisplayLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs, tasks, prompts...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText : 'Copy Prompt',
        errorText  : 'Error',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- Mermaid diagrams in Markdown code fences (```mermaid) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
</html>
